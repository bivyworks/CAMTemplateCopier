name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes CAMTemplateCopier tests
      - name: Unit tests
        run: python -I -m unittest discover -s tests -p "test_*.py"
